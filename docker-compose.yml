name: n8n-portfolio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      TZ: Europe/Belgrade
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00_create_apps_db.sql:/docker-entrypoint-initdb.d/00_create_apps_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Belgrade
      TZ: Europe/Belgrade
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET}
      PAYMENTS_SIGNING_SECRET: ${PAYMENTS_SIGNING_SECRET}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      MOCK_POS_URL: http://localhost:5678/webhook/mock/pos/orders
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      RFQ_API_TOKEN: ${RFQ_API_TOKEN}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-http://localhost:5678/webhook/mock/llm-agent}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./workflows:/import/workflows:ro

volumes:
  pgdata:
  n8ndata:
